<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetup Cards</title>
<style>
  /* The print page size is set from script (see applyFormat), because @page cannot depend on a class. */
  :root {
    --s: 1;            /* content scale: 1 = a 105 x 148.5 mm card */
    --cols: 2;
    --rows: 2;
    --sheet-w: 210mm;
    --sheet-h: 297mm;
    --card-w: 105mm;
    --card-h: 148.5mm;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #e9e9ec;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #d0d0d5;
    font-size: 14px;
  }
  .toolbar button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid #111;
    border-radius: 6px;
    background: #111;
    color: #fff;
    cursor: pointer;
  }
  .toolbar .seg { display: flex; }
  .toolbar .seg button {
    background: #fff;
    color: #111;
    border-radius: 0;
    margin-left: -1px;
  }
  .toolbar .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .toolbar .seg button:last-child { border-radius: 0 6px 6px 0; }
  .toolbar .seg button[aria-pressed="true"] { background: #111; color: #fff; }
  .toolbar .hint { color: #666; }
  .toolbar .help-btn {
    margin-left: auto;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
    background: #fff;
    color: #111;
    font-weight: 600;
  }
  .toolbar .help-btn[aria-expanded="true"] { background: #111; color: #fff; }
  .help {
    max-width: 640px;
    margin: 12px auto 0;
    padding: 16px 20px;
    background: #fff;
    border-radius: 8px;
    font-size: 14px;
  }
  .help h2 { margin: 0 0 8px; font-size: 16px; }
  .help p { margin: 0 0 8px; }
  .help dl { margin: 0; }
  .help dt { font-weight: 600; margin-top: 8px; }
  .help dd { margin: 0; color: #444; }

  /* One sheet = 2 x 2 cards (portrait sheet, 4x) or 4 x 2 cards (landscape sheet, 8x) */
  .sheet {
    width: var(--sheet-w);
    height: var(--sheet-h);
    margin: 16px auto;
    background: #fff;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--card-w));
    grid-template-rows: repeat(var(--rows), var(--card-h));
    overflow: hidden;
    break-after: page;
  }
  .sheet:last-child { break-after: auto; }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: calc(11mm * var(--s)) calc(10mm * var(--s)) calc(10mm * var(--s));
    overflow: hidden;
  }
  /* Cut guides between the cards (script marks the last column / row) */
  .card { border-right: 0.2mm dashed #bbb; border-bottom: 0.2mm dashed #bbb; }
  .card.last-col { border-right: 0; }
  .card.last-row { border-bottom: 0; }

  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: calc(6mm * var(--s));
    min-height: calc(20mm * var(--s));
  }
  .name {
    margin: 0;
    font-size: calc(25pt * var(--s) * var(--fit, 1));
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }
  .logo {
    flex: none;
    max-width: calc(24mm * var(--s));
    max-height: calc(18mm * var(--s));
    object-fit: contain;
  }

  .status {
    align-self: flex-start;
    margin-top: calc(4mm * var(--s));
    padding: calc(1.2mm * var(--s)) calc(3.2mm * var(--s));
    border: 0.35mm solid #111;
    border-radius: 99mm;
    font-size: calc(9pt * var(--s));
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .specs {
    margin: calc(9mm * var(--s)) 0 0;
    display: flex;
    flex-direction: column;
    gap: calc(6mm * var(--s));
  }
  .specs dt {
    font-size: calc(8pt * var(--s));
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #666;
  }
  .specs dd {
    margin: calc(1mm * var(--s)) 0 0;
    font-size: calc(15pt * var(--s));
    line-height: 1.2;
    font-weight: 500;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  .url {
    margin-top: auto;
    padding-top: calc(3mm * var(--s));
    border-top: 0.35mm solid #111;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: calc(9pt * var(--s));
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  .setup-error {
    margin: 40px auto;
    max-width: 560px;
    padding: 20px 24px;
    background: #fff;
    border: 2px solid #c62828;
    border-radius: 8px;
    line-height: 1.45;
  }
  .setup-error h2 { margin: 0 0 8px; color: #c62828; }
  .setup-error pre { padding: 12px; background: #f3f3f5; border-radius: 6px; overflow-x: auto; }

  .empty {
    margin: 40px auto;
    max-width: 480px;
    text-align: center;
    color: #666;
  }

  @media print {
    body { background: none; }
    .toolbar, .help, .empty, .setup-error { display: none; }
    .sheet { margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button type="button" onclick="window.print()">Print</button>
  <div class="seg" role="group" aria-label="Paper size" data-key="paper">
    <button type="button" data-value="a4" aria-pressed="true">A4</button>
    <button type="button" data-value="letter" aria-pressed="false">Letter</button>
  </div>
  <div class="seg" role="group" aria-label="Cards per sheet" data-key="layout">
    <button type="button" data-value="4x" aria-pressed="true" title="4 cards per sheet">4x</button>
    <button type="button" data-value="8x" aria-pressed="false" title="8 cards per sheet">8x</button>
  </div>
  <span class="hint" id="hint"></span>
  <button type="button" class="help-btn" id="help-btn" aria-expanded="false" aria-controls="help" title="Explain all fields">?</button>
</div>
<div class="help" id="help" hidden></div>
<main id="sheets"></main>

<script src="keyboards.js"></script>
<script>
(function () {
  // 4x: 2 x 2 cards per portrait sheet. 8x: 4 x 2 cards per landscape sheet.
  var LAYOUTS = {
    "4x": { cols: 2, rows: 2, orientation: "portrait" },
    "8x": { cols: 4, rows: 2, orientation: "landscape" },
  };
  // Sheet size in mm (portrait) and the CSS @page keyword.
  var PAPERS = {
    a4: { w: 210, h: 297, label: "A4", css: "A4" },
    letter: { w: 215.9, h: 279.4, label: "US Letter", css: "letter" },
  };
  var STORAGE_KEY = "meetup-cards-settings";
  // Regions that use US Letter; everywhere else defaults to A4.
  var LETTER_REGIONS = ["US", "CA", "MX", "CL", "CO", "VE", "PH", "CR", "GT", "DO", "PA", "PR", "SV", "NI", "HN", "BO"];
  var REF_W = 105, REF_H = 148.5;  // card size the type sizes were designed for
  var logoSrc = "";
  var LOGO_CANDIDATES = ["logo.svg", "logo.png", "logo.jpg", "logo.jpeg", "logo.webp"];
  var SPEC_FIELDS = [
    ["switches", "Switches"],
    ["keycaps", "Keycaps"],
    ["plate", "Plate"],
    ["notes", "Notes"],
  ];
  // Every field that can be used in keyboards.js, in the order shown on the card.
  var ALL_FIELDS = [
    ["Name", "Required. The title of the card. A block without a Name is ignored.", "My keyboard"],
    ["Status", "Optional. Shown under the name, e.g. the group buy or build status.", "Work in progress"],
    ["Switches", "Optional. The switches used.", "Cherry ULP tactile"],
    ["Keycaps", "Optional. The keycap set used.", "KAM Astha"],
    ["Plate", "Optional. The plate material or type.", "FR4"],
    ["Notes", "Optional. Free text shown at the end of the specs. Also accepted: Note, Comment, Comments.", "Wireless, ZMK"],
    ["URL", "Optional. A link shown at the bottom of the card.", "https://example.com"],
  ];
  // Alternative spellings accepted in keyboards.js
  var ALIASES = { note: "notes", comment: "notes", comments: "notes" };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function value(keyboard, field) {
    var v = keyboard[field];
    return v == null ? "" : String(v).trim();
  }

  function buildCard(keyboard) {
    var card = el("section", "card");

    var head = el("div", "head");
    head.appendChild(el("h1", "name", value(keyboard, "name")));
    if (logoSrc) head.appendChild(buildLogo());
    card.appendChild(head);

    var status = value(keyboard, "status");
    if (status) card.appendChild(el("div", "status", status));

    var specs = el("dl", "specs");
    SPEC_FIELDS.forEach(function (field) {
      var v = value(keyboard, field[0]);
      if (!v) return;
      var row = el("div");
      row.appendChild(el("dt", null, field[1]));
      row.appendChild(el("dd", null, v));
      specs.appendChild(row);
    });
    if (specs.children.length) card.appendChild(specs);

    var url = value(keyboard, "url");
    if (url) card.appendChild(el("div", "url", url));

    return card;
  }

  // Long names shrink until they fit into two lines (but not below MIN_FIT).
  var MIN_FIT = 0.6;
  function fitNames() {
    document.querySelectorAll(".name").forEach(function (name) {
      name.style.removeProperty("--fit");
      var fit = 1;
      while (fit > MIN_FIT && name.getBoundingClientRect().height > parseFloat(getComputedStyle(name).lineHeight) * 2.5) {
        fit = Math.round((fit - 0.04) * 100) / 100;
        name.style.setProperty("--fit", fit);
      }
    });
  }

  function buildLogo() {
    var img = el("img", "logo");
    img.src = logoSrc;
    img.alt = "";
    return img;
  }

  // The logo is optional: only add it to the cards once a file actually loaded.
  function loadLogo(index) {
    if (index >= LOGO_CANDIDATES.length) return;
    var probe = new Image();
    probe.onload = function () {
      logoSrc = probe.src;
      document.querySelectorAll(".head").forEach(function (head) {
        head.appendChild(buildLogo());
      });
      fitNames();
    };
    probe.onerror = function () { loadLogo(index + 1); };
    probe.src = LOGO_CANDIDATES[index];
  }

  // keyboards.js holds plain "Field: value" lines; an empty line starts the next keyboard.
  function parseKeyboards(text) {
    var list = [];
    var current = null;
    String(text || "").split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) { current = null; return; }
      if (line.charAt(0) === "#") return;
      var colon = line.indexOf(":");
      if (colon < 1) return;
      if (!current) { current = {}; list.push(current); }
      var field = line.slice(0, colon).trim().toLowerCase();
      // A literal \n in the text forces a line break on the card.
      current[ALIASES[field] || field] = line.slice(colon + 1).trim().replace(/\s*\\n\s*/g, "\n");
    });
    return list;
  }

  var keyboards = parseKeyboards(window.KEYBOARDS).filter(function (k) { return k && value(k, "name"); });
  var sheets = document.getElementById("sheets");
  var hint = document.getElementById("hint");
  var pageStyle = document.createElement("style");
  document.head.appendChild(pageStyle);

  // Shown when keyboards.js lost its first or last line (the file then fails to load).
  function buildSetupError() {
    var box = el("div", "setup-error");
    box.appendChild(el("h2", null, "keyboards.js could not be read"));
    box.appendChild(el("p", null, "The first and the last line of the file are needed. Make sure it starts with the first line below, ends with the last line below, and has the keyboards in between:"));
    box.appendChild(el("pre", null, "window.KEYBOARDS = String.raw`\n\n" + ALL_FIELDS.map(function (f) { return f[0] + ": " + f[2]; }).join("\n") + "\n\n`;"));
    box.appendChild(el("p", null, "All possible fields are listed above (only Name is required). Press the ? button in the toolbar for an explanation of each field."));
    box.appendChild(el("p", null, "Also check that the text in between contains no backtick (`)."));
    return box;
  }

  function buildHelp() {
    var box = document.getElementById("help");
    box.appendChild(el("h2", null, "Fields in keyboards.js"));
    box.appendChild(el("p", null, "One block per keyboard, one \"Field: value\" line per field, an empty line between keyboards. Lines starting with # are ignored. Type \\n inside a value to force a line break."));
    var dl = el("dl");
    ALL_FIELDS.forEach(function (f) {
      dl.appendChild(el("dt", null, f[0]));
      dl.appendChild(el("dd", null, f[1]));
    });
    box.appendChild(dl);
    var btn = document.getElementById("help-btn");
    btn.addEventListener("click", function () {
      box.hidden = !box.hidden;
      btn.setAttribute("aria-expanded", String(!box.hidden));
    });
  }
  buildHelp();

  function detectPaper() {
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    for (var i = 0; i < langs.length; i++) {
      var m = /^[a-z]{2,3}[-_]([A-Za-z]{2})\b/.exec(langs[i]);
      if (m) return LETTER_REGIONS.indexOf(m[1].toUpperCase()) >= 0 ? "letter" : "a4";
    }
    return "a4";
  }

  function loadSettings() {
    var settings = { paper: detectPaper(), layout: "4x" };
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (PAPERS[saved.paper]) settings.paper = saved.paper;
      if (LAYOUTS[saved.layout]) settings.layout = saved.layout;
    } catch (e) {}
    return settings;
  }

  function saveSettings() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  var settings = loadSettings();

  function render() {
    var spec = LAYOUTS[settings.layout];
    var paper = PAPERS[settings.paper];
    var perSheet = spec.cols * spec.rows;
    var landscape = spec.orientation === "landscape";
    var sheetW = landscape ? paper.h : paper.w;
    var sheetH = landscape ? paper.w : paper.h;
    var cardW = sheetW / spec.cols;
    var cardH = sheetH / spec.rows;
    var root = document.documentElement.style;

    root.setProperty("--sheet-w", sheetW + "mm");
    root.setProperty("--sheet-h", sheetH + "mm");
    root.setProperty("--card-w", cardW + "mm");
    root.setProperty("--card-h", cardH + "mm");
    root.setProperty("--cols", spec.cols);
    root.setProperty("--rows", spec.rows);
    root.setProperty("--s", Math.min(cardW / REF_W, cardH / REF_H).toFixed(3));
    pageStyle.textContent = "@page { size: " + paper.css + " " + spec.orientation + "; margin: 0; }";
    document.querySelectorAll(".seg button").forEach(function (b) {
      var key = b.parentNode.getAttribute("data-key");
      b.setAttribute("aria-pressed", String(settings[key] === b.getAttribute("data-value")));
    });

    sheets.textContent = "";
    if (typeof window.KEYBOARDS !== "string") {
      sheets.appendChild(buildSetupError());
      hint.textContent = "keyboards.js could not be read";
      return;
    }
    if (!keyboards.length) {
      sheets.appendChild(el("p", "empty", "No keyboards found. Add entries to keyboards.js and reload."));
      hint.textContent = "";
      return;
    }

    for (var i = 0; i < keyboards.length; i += perSheet) {
      var sheet = el("div", "sheet");
      keyboards.slice(i, i + perSheet).forEach(function (k) { sheet.appendChild(buildCard(k)); });
      while (sheet.children.length < perSheet) sheet.appendChild(el("section", "card"));
      Array.prototype.forEach.call(sheet.children, function (card, n) {
        if (n % spec.cols === spec.cols - 1) card.classList.add("last-col");
        if (n >= perSheet - spec.cols) card.classList.add("last-row");
      });
      sheets.appendChild(sheet);
    }

    var sheetCount = Math.ceil(keyboards.length / perSheet);
    hint.textContent = keyboards.length + (keyboards.length === 1 ? " card" : " cards") + " on " +
      sheetCount + (sheetCount === 1 ? " sheet" : " sheets") +
      " · print on " + paper.label + " " + spec.orientation + " at 100% scale, no margins";
    fitNames();
  }

  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      settings[b.parentNode.getAttribute("data-key")] = b.getAttribute("data-value");
      saveSettings();
      render();
    });
  });

  render();
  loadLogo(0);
})();
</script>
</body>
</html>
