<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetup Cards</title>
<style>
  /* The print page size is set from script (see applyFormat), because @page cannot depend on a class. */
  :root {
    --s: 1;            /* content scale: 1 = a 105 x 148.5 mm card */
    --cols: 2;
    --rows: 2;
    --sheet-w: 210mm;
    --sheet-h: 297mm;
    --card-w: 105mm;
    --card-h: 148.5mm;
    --zoom: 1;         /* on-screen preview scale, set from script; print is always 1 */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: #e9e9ec;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid #111;
    border-radius: 6px;
    background: #fff;
    color: #111;
    cursor: pointer;
  }
  button.primary { background: #111; color: #fff; }
  button:disabled { opacity: 0.3; cursor: default; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid #1a5fd0;
    outline-offset: 2px;
  }

  .toolbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #d0d0d5;
    font-size: 14px;
  }
  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button[aria-pressed="true"] { background: #111; color: #fff; }
  .seg button:focus-visible { position: relative; }
  .toolbar .hint { flex: 1; min-width: 0; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toolbar .help-btn {
    flex: none;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
    font-weight: 600;
  }
  .toolbar .help-btn[aria-expanded="true"] { background: #111; color: #fff; }

  /* Editor on the left, card preview on the right */
  .app { flex: 1; min-height: 0; display: flex; }
  .editor {
    flex: none;
    width: 380px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-right: 1px solid #d0d0d5;
    font-size: 14px;
  }
  .editor-head { padding: 10px 12px; border-bottom: 1px solid #d0d0d5; }
  .editor-head .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .editor-head .row + .row { margin-top: 8px; }
  body.editor-hidden .editor { display: none; }
  .editor-head button { padding: 4px 10px; }
  .editor-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
  .editor-body.text { display: flex; }
  .editor-foot { padding: 8px 12px; border-top: 1px solid #d0d0d5; font-size: 12px; color: #666; }
  .preview { flex: 1; min-width: 0; overflow: auto; padding: 0 16px; }

  .kb { margin: 0 0 12px; padding: 8px 12px 12px; border: 1px solid #d0d0d5; border-radius: 8px; min-width: 0; }
  .kb:focus-within { border-color: #111; }
  .kb legend { padding: 0 6px; font-weight: 600; overflow-wrap: anywhere; }
  .kb label {
    display: block;
    margin: 8px 0 2px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #666;
  }
  .kb input, .kb textarea, .text-view {
    display: block;
    width: 100%;
    padding: 5px 8px;
    border: 1px solid #b8b8c0;
    border-radius: 6px;
    background: #fff;
    color: #111;
    font: inherit;
    line-height: 1.3;
  }
  .kb textarea { resize: none; overflow: hidden; }
  .kb-actions { display: flex; gap: 6px; margin-top: 12px; }
  .kb-actions button { padding: 3px 10px; font-size: 13px; }
  .kb-actions .spacer { flex: 1; }
  .add-btn { width: 100%; }
  .text-view {
    flex: 1;
    min-height: 300px;
    resize: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.45;
  }

  .notice {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    max-width: 640px;
    margin: 12px auto 0;
    padding: 12px 16px;
    background: #fff;
    border: 1px solid #111;
    border-radius: 8px;
    font-size: 14px;
  }
  .notice[hidden] { display: none; }
  .notice span { flex: 1; min-width: 200px; }

  /* Popover below the ? button */
  .help {
    inset: 52px 16px auto auto;
    width: 340px;
    max-width: calc(100vw - 32px);
    margin: 0;
    padding: 16px 20px;
    background: #fff;
    color: #111;
    border: 1px solid #111;
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    font-size: 14px;
  }
  .help h2 { margin: 0 0 8px; font-size: 16px; }
  .help h2:not(:first-child) { margin-top: 16px; }
  .help p { margin: 0 0 8px; }
  .help dl { margin: 12px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
  .help dt { font-weight: 600; white-space: nowrap; }
  .help dd { margin: 0; color: #444; }

  /* One sheet = 2 x 2 cards (portrait sheet, 4x) or 4 x 2 cards (landscape sheet, 8x) */
  #sheets { display: flex; flex-direction: column; align-items: center; padding-top: 16px; }
  /* On screen the sheet is scaled to fit the preview; the negative margins give back the space it no longer needs. */
  .sheet {
    flex: none;
    width: var(--sheet-w);
    height: var(--sheet-h);
    margin: 0 calc(var(--sheet-w) * (var(--zoom) - 1)) calc(var(--sheet-h) * (var(--zoom) - 1) + 16px) 0;
    transform: scale(var(--zoom));
    transform-origin: 0 0;
    background: #fff;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--card-w));
    grid-template-rows: repeat(var(--rows), var(--card-h));
    overflow: hidden;
    break-after: page;
  }
  .sheet:last-child { break-after: auto; }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: calc(11mm * var(--s)) calc(10mm * var(--s)) calc(10mm * var(--s));
    overflow: hidden;
  }
  /* Cut guides between the cards (script marks the last column / row) */
  .card { border-right: 0.2mm dashed #bbb; border-bottom: 0.2mm dashed #bbb; }
  .card.last-col { border-right: 0; }
  .card.last-row { border-bottom: 0; }

  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: calc(6mm * var(--s));
    min-height: calc(20mm * var(--s));
  }
  .name {
    margin: 0;
    font-size: calc(25pt * var(--s) * var(--fit, 1));
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }
  .logo {
    flex: none;
    max-width: calc(24mm * var(--s));
    max-height: calc(18mm * var(--s));
    object-fit: contain;
  }

  .status {
    align-self: flex-start;
    margin-top: calc(4mm * var(--s));
    padding: calc(1.2mm * var(--s)) calc(3.2mm * var(--s));
    border: 0.35mm solid #111;
    border-radius: 99mm;
    font-size: calc(9pt * var(--s));
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .specs {
    margin: calc(9mm * var(--s)) 0 0;
    display: flex;
    flex-direction: column;
    gap: calc(6mm * var(--s));
  }
  .specs dt {
    font-size: calc(8pt * var(--s));
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #666;
  }
  .specs dd {
    margin: calc(1mm * var(--s)) 0 0;
    font-size: calc(15pt * var(--s));
    line-height: 1.2;
    font-weight: 500;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  .url {
    margin-top: auto;
    padding-top: calc(3mm * var(--s));
    border-top: 0.35mm solid #111;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: calc(9pt * var(--s));
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  .setup-error {
    margin: 12px auto 0;
    max-width: 560px;
    padding: 20px 24px;
    background: #fff;
    border: 2px solid #c62828;
    border-radius: 8px;
    line-height: 1.45;
  }
  .setup-error h2 { margin: 0 0 8px; color: #c62828; }
  .setup-error pre { padding: 12px; background: #f3f3f5; border-radius: 6px; overflow-x: auto; }

  .empty {
    margin: 40px auto;
    max-width: 480px;
    text-align: center;
    color: #666;
  }
  .empty button { margin-top: 12px; }

  @media screen {
    .card:not(:empty) { cursor: pointer; }
  }

  @media screen and (max-width: 900px) {
    html, body { height: auto; }
    .app { display: block; }
    .editor { width: auto; border-right: 0; border-bottom: 1px solid #d0d0d5; }
    .editor-body { max-height: 60vh; }
  }

  @media print {
    html, body { height: auto; }
    body { display: block; background: none; }
    .toolbar, .editor, .notice, .help, .empty, .setup-error { display: none; }
    .app, #sheets { display: block; padding: 0; }
    .preview { overflow: visible; padding: 0; }
    .sheet { margin: 0; transform: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button type="button" id="editor-btn" aria-controls="editor" aria-expanded="true">Hide editor</button>
  <button type="button" class="primary" onclick="window.print()">Print</button>
  <div class="seg" role="group" aria-label="Paper size" data-key="paper">
    <button type="button" data-value="a4" aria-pressed="true">A4</button>
    <button type="button" data-value="letter" aria-pressed="false">Letter</button>
  </div>
  <div class="seg" role="group" aria-label="Cards per sheet" data-key="layout">
    <button type="button" data-value="4x" aria-pressed="false" title="4 cards per sheet">4x</button>
    <button type="button" data-value="8x" aria-pressed="true" title="8 cards per sheet">8x</button>
  </div>
  <span class="hint" id="hint"></span>
  <button type="button" class="help-btn" id="help-btn" popovertarget="help" aria-expanded="false" title="Help and keyboard shortcuts">?</button>
</div>
<div class="help" id="help" popover></div>
<div class="app">
  <aside class="editor" id="editor" aria-label="Keyboard editor">
    <div class="editor-head">
      <div class="row">
      <div class="seg" role="group" aria-label="Editor view" data-key="view">
        <button type="button" data-value="form" aria-pressed="true">Form</button>
        <button type="button" data-value="text" aria-pressed="false">Text</button>
      </div>
      <button type="button" id="import-btn" title="Load a keyboards.js file">Import</button>
      <button type="button" id="export-btn" title="Download the keyboards as keyboards.js">Export</button>
      <button type="button" id="save-btn" title="Write the keyboards straight into your keyboards.js file" hidden>Save</button>
      </div>
      <div class="row">
      <button type="button" id="logo-btn" title="Add a logo to the top right corner of every card">Logo</button>
      <button type="button" id="logo-remove-btn" hidden>Remove logo</button>
      <button type="button" id="clear-btn" title="Remove all keyboards">Clear</button>
      </div>
      <input type="file" id="import-file" accept=".js,.txt,text/plain,text/javascript" hidden>
      <input type="file" id="logo-file" accept="image/*" hidden>
    </div>
    <div class="editor-body" id="editor-body"></div>
    <div class="editor-foot">Tab: next field · Alt+↑/↓: move keyboard · Ctrl/⌘+Enter: add keyboard · more under ?</div>
  </aside>
  <div class="preview" id="preview">
    <div class="notice" id="notice" hidden></div>
    <div id="setup-error"></div>
    <main id="sheets"></main>
  </div>
</div>

<!-- Optional: the cards shown on the first visit. Without this file the built-in examples are used. -->
<script src="keyboards.js" onerror="window.KEYBOARDS_MISSING = true"></script>
<script>
(function () {
  // 4x: 2 x 2 cards per portrait sheet. 8x: 4 x 2 cards per landscape sheet.
  var LAYOUTS = {
    "4x": { cols: 2, rows: 2, orientation: "portrait" },
    "8x": { cols: 4, rows: 2, orientation: "landscape" },
  };
  // Sheet size in mm (portrait) and the CSS @page keyword.
  var PAPERS = {
    a4: { w: 210, h: 297, label: "A4", css: "A4" },
    letter: { w: 215.9, h: 279.4, label: "US Letter", css: "letter" },
  };
  var STORAGE_KEY = "meetup-cards-settings";
  var DATA_KEY = "meetup-cards-data";
  var LOGO_KEY = "meetup-cards-logo";
  var LOGO_MAX_PX = 800;  // uploaded logos are scaled down to this size before they are stored
  // Shown on the first visit when there is no keyboards.js next to this page.
  var EXAMPLES = [
    "Name: Example 40%",
    "Status: OpenSource",
    "Switches: Invokeys Hojicha Reserve",
    "Keycaps: DSS 99Cent",
    "Plate: Aluminium",
    "Notes: Replace these examples with your own keyboards.",
    "",
    "Name: Example 30%",
    "Status: Work in progress",
    "Switches: KTT Roses",
    "Keycaps: SLK Dessau",
    "URL: https://example.com",
  ].join("\n");
  // Regions that use US Letter; everywhere else defaults to A4.
  var LETTER_REGIONS = ["US", "CA", "MX", "CL", "CO", "VE", "PH", "CR", "GT", "DO", "PA", "PR", "SV", "NI", "HN", "BO"];
  var REF_W = 105, REF_H = 148.5;  // card size the type sizes were designed for
  var logoSrc = "";
  var uploadedLogo = "";
  var NO_LOGO = "none";  // stored in place of a logo after "Remove logo", so a logo file on disk stays off too
  var LOGO_CANDIDATES = ["logo.svg", "logo.png", "logo.jpg", "logo.jpeg", "logo.webp"];
  var SPEC_FIELDS = [
    ["switches", "Switches"],
    ["keycaps", "Keycaps"],
    ["plate", "Plate"],
    ["notes", "Notes"],
  ];
  // Every field of a keyboard, in the order shown on the card and in the form.
  // [field name, example value]. Only Name is required.
  var ALL_FIELDS = [
    ["Name", "Keyboard name"],
    ["Status", "Work in progress"],
    ["Switches", "Voyager Tactile "],
    ["Keycaps", "KAM Astha"],
    ["Plate", "FR4"],
    ["Notes", "Wireless, ZMK"],
    ["URL", "https://example.com"],
  ];
  var SHORTCUTS = [
    ["Tab / Shift+Tab", "Next / previous field"],
    ["Enter", "Line break inside a field"],
    ["Alt+↑ / Alt+↓", "Move the current keyboard up / down"],
    ["Ctrl+Enter", "Add a keyboard below the current one"],
    ["Ctrl+Shift+D", "Duplicate the current keyboard"],
    ["Ctrl+Shift+Backspace", "Delete the current keyboard"],
    ["Esc", "Close this help"],
  ];
  // Alternative spellings accepted in keyboards.js
  var ALIASES = { note: "notes", comment: "notes", comments: "notes" };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function value(keyboard, field) {
    var v = keyboard[field];
    // Spaces around a line break are dropped, so every line starts without a space.
    return v == null ? "" : String(v).trim().replace(/[ \t]*\r?\n[ \t]*/g, "\n");
  }

  function buildCard(keyboard, index) {
    var card = el("section", "card");
    card.addEventListener("click", function () {
      if (settings.view === "form") focusEntry(index, "[data-field=name]");
    });

    var head = el("div", "head");
    head.appendChild(el("h1", "name", value(keyboard, "name")));
    if (logoSrc) head.appendChild(buildLogo());
    card.appendChild(head);

    var status = value(keyboard, "status");
    if (status) card.appendChild(el("div", "status", status));

    var specs = el("dl", "specs");
    SPEC_FIELDS.forEach(function (field) {
      var v = value(keyboard, field[0]);
      if (!v) return;
      var row = el("div");
      row.appendChild(el("dt", null, field[1]));
      row.appendChild(el("dd", null, v));
      specs.appendChild(row);
    });
    if (specs.children.length) card.appendChild(specs);

    var url = value(keyboard, "url");
    if (url) card.appendChild(el("div", "url", url));

    return card;
  }

  // Long names shrink until they fit into two lines (but not below MIN_FIT).
  var MIN_FIT = 0.6;
  function fitNames() {
    document.querySelectorAll(".name").forEach(function (name) {
      name.style.removeProperty("--fit");
      var fit = 1;
      // offsetHeight, because it ignores the on-screen preview scale
      while (fit > MIN_FIT && name.offsetHeight > parseFloat(getComputedStyle(name).lineHeight) * 2.5) {
        fit = Math.round((fit - 0.04) * 100) / 100;
        name.style.setProperty("--fit", fit);
      }
    });
  }

  function buildLogo() {
    var img = el("img", "logo");
    img.src = logoSrc;
    img.alt = "";
    return img;
  }

  // Local use only: a logo file next to index.html is picked up when the page is opened from disk.
  // Online there is no default logo; an uploaded logo always wins.
  function loadLogoFile(index) {
    if (location.protocol !== "file:" || index >= LOGO_CANDIDATES.length) return;
    var probe = new Image();
    probe.onload = function () {
      if (uploadedLogo) return;
      logoSrc = probe.src;
      document.getElementById("logo-remove-btn").hidden = false;
      renderCards();
    };
    probe.onerror = function () { loadLogoFile(index + 1); };
    probe.src = LOGO_CANDIDATES[index];
  }

  function setUploadedLogo(src) {
    uploadedLogo = src;
    logoSrc = src;
    try {
      localStorage.setItem(LOGO_KEY, src || NO_LOGO);
    } catch (e) {
      alert("The logo is too large to be remembered by the browser. It is used until you close or reload the page.");
    }
    document.getElementById("logo-remove-btn").hidden = !src;
    renderCards();
  }

  function readLogo(file) {
    var reader = new FileReader();
    reader.onload = function () {
      if (file.type === "image/svg+xml") { setUploadedLogo(reader.result); return; }
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, LOGO_MAX_PX / Math.max(img.naturalWidth, img.naturalHeight));
        var canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        setUploadedLogo(canvas.toDataURL("image/png"));
      };
      img.onerror = function () { alert("This file could not be read as an image."); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  // The text format: plain "Field: value" lines; an empty line starts the next keyboard.
  function parseKeyboards(text) {
    var list = [];
    var current = null;
    String(text || "").split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) { current = null; return; }
      if (line.charAt(0) === "#") return;
      var colon = line.indexOf(":");
      if (colon < 1) return;
      if (!current) { current = {}; list.push(current); }
      var field = line.slice(0, colon).trim().toLowerCase();
      // A literal \n in the text forces a line break on the card.
      current[ALIASES[field] || field] = line.slice(colon + 1).trim().replace(/\s*\\n\s*/g, "\n");
    });
    return list;
  }

  function serializeKeyboards(keyboards) {
    var known = ALL_FIELDS.map(function (f) { return f[0].toLowerCase(); });
    return keyboards.map(function (k) {
      // The Name line is always written, so that a keyboard without any text keeps its place.
      var lines = ["Name: " + encodeValue(value(k, "name"))];
      ALL_FIELDS.slice(1).forEach(function (f) {
        var v = value(k, f[0].toLowerCase());
        if (v) lines.push(f[0] + ": " + encodeValue(v));
      });
      Object.keys(k).forEach(function (key) {
        if (known.indexOf(key) < 0 && value(k, key)) lines.push(key + ": " + encodeValue(value(k, key)));
      });
      return lines.join("\n").replace(/[ \t]+$/gm, "");
    }).join("\n\n");
  }

  function encodeValue(v) {
    return v.replace(/\s*\n\s*/g, " \\n ");
  }

  // An exported keyboards.js works both for Import and as the file next to index.html.
  function toKeyboardsFile(text) {
    // Backticks and ${ would end the String.raw text when the file is loaded as a script.
    text = text.replace(/`/g, "'").replace(/\$\{/g, "$ {");
    return "window.KEYBOARDS = String.raw`\n\n" +
      "# One block per keyboard, separated by an empty line.\n" +
      "# Do not delete the first and the last line of this file and never type a backtick.\n" +
      "# Fields: " + ALL_FIELDS.map(function (f) { return f[0]; }).join(", ") + " (only Name is required).\n" +
      "# Type \\n to force a line break inside a value.\n\n" +
      text + "\n\n" +
      "# ---- Do not delete the line below: it closes the list. ----\n`;\n";
  }

  // Imported files are only ever read as text, never run.
  function fromKeyboardsFile(fileText) {
    var m = /String\.raw`([\s\S]*)`/.exec(fileText);
    return m ? m[1] : fileText;
  }

  // keyboards.js (or the built-in examples) is only the starting point: once the visitor
  // changes something, their own list is kept in the browser and used instead.
  var fileText = typeof window.KEYBOARDS === "string" ? window.KEYBOARDS : EXAMPLES;
  var list, seed, edited;
  var rawText = null;  // what was typed in the text view, kept as typed until the form changes the list

  function loadData() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(DATA_KEY) || "null"); } catch (e) {}
    if (saved && saved.edited && typeof saved.text === "string") {
      rawText = saved.text;
      list = parseKeyboards(rawText);
      seed = saved.seed;
      edited = true;
    } else {
      useFileText();
    }
  }

  function useFileText() {
    rawText = null;
    list = parseKeyboards(fileText);
    seed = fileText;
    edited = false;
  }

  function currentText() {
    return rawText != null ? rawText : serializeKeyboards(list);
  }

  function saveData() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify({ text: currentText(), seed: seed, edited: edited })); } catch (e) {}
  }

  function changed() {
    edited = true;
    saveData();
    renderCards();
  }

  var editorBody = document.getElementById("editor-body");
  var preview = document.getElementById("preview");
  var sheets = document.getElementById("sheets");
  var hint = document.getElementById("hint");
  var pageStyle = document.createElement("style");
  document.head.appendChild(pageStyle);

  // Shown when keyboards.js is there but lost its first or last line (the file then fails to load).
  function buildSetupError() {
    var box = el("div", "setup-error");
    box.appendChild(el("h2", null, "keyboards.js could not be read"));
    box.appendChild(el("p", null, "The first and the last line of the file are needed. Make sure it starts with the first line below, ends with the last line below, and has the keyboards in between:"));
    box.appendChild(el("pre", null, "window.KEYBOARDS = String.raw`\n\n" + ALL_FIELDS.map(function (f) { return f[0] + ": " + f[1]; }).join("\n") + "\n\n`;"));
    box.appendChild(el("p", null, "All possible fields are listed above (only Name is required)."));
    box.appendChild(el("p", null, "Also check that the text in between contains no backtick (`)."));
    return box;
  }

  function buildHelp() {
    var box = document.getElementById("help");
    box.appendChild(el("h2", null, "Help"));
    box.appendChild(el("p", null, "Your keyboards are saved in this browser only. Use Export to keep a copy or to move them to another device, and Import to load such a file again."));
    box.appendChild(el("p", null, "The Text view shows all keyboards as plain text, which is handy for pasting many at once. Each line is one field, for example \"Switches: Cherry MX Black\". Leave an empty line between two keyboards and type \\n where you want a line break."));
    box.appendChild(el("h2", null, "Keyboard shortcuts"));
    if (/Mac|iPhone|iPad/.test(navigator.platform)) box.appendChild(el("p", null, "On a Mac use ⌘ instead of Ctrl."));
    var dl = el("dl");
    SHORTCUTS.forEach(function (row) {
      dl.appendChild(el("dt", null, row[0]));
      dl.appendChild(el("dd", null, row[1]));
    });
    box.appendChild(dl);
    box.addEventListener("toggle", function (e) {
      document.getElementById("help-btn").setAttribute("aria-expanded", String(e.newState === "open"));
    });
  }
  buildHelp();

  function detectPaper() {
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    for (var i = 0; i < langs.length; i++) {
      var m = /^[a-z]{2,3}[-_]([A-Za-z]{2})\b/.exec(langs[i]);
      if (m) return LETTER_REGIONS.indexOf(m[1].toUpperCase()) >= 0 ? "letter" : "a4";
    }
    return "a4";
  }

  function loadSettings() {
    var settings = { paper: detectPaper(), layout: "8x", view: "form", editor: true };
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      if (PAPERS[saved.paper]) settings.paper = saved.paper;
      if (LAYOUTS[saved.layout]) settings.layout = saved.layout;
      if (saved.view === "form" || saved.view === "text") settings.view = saved.view;
      if (saved.editor === false) settings.editor = false;
    } catch (e) {}
    return settings;
  }

  function saveSettings() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  var settings = loadSettings();

  // ---- Editor ----

  function grow(textarea) {
    textarea.style.height = "auto";
    textarea.style.height = textarea.scrollHeight + 2 + "px";
  }

  function legendText(keyboard, index) {
    return value(keyboard, "name").replace(/\s*\n\s*/g, " ") || "Keyboard " + (index + 1);
  }

  function focusEntry(index, selector, caret) {
    var entry = editorBody.querySelectorAll(".kb")[index];
    var target = entry && entry.querySelector(selector);
    if (!target) return;
    target.focus();
    if (caret != null && target.setSelectionRange) target.setSelectionRange(caret, caret);
    entry.scrollIntoView({ block: "nearest" });
  }

  function listChanged() {
    rawText = null;
    changed();
    renderEditor();
  }

  function addKeyboard(index) {
    list.splice(index, 0, {});
    listChanged();
    focusEntry(index, "[data-field=name]");
  }

  // Returns false when the keyboard is already first / last.
  function moveKeyboard(index, step) {
    var to = index + step;
    if (to < 0 || to >= list.length) return false;
    list.splice(to, 0, list.splice(index, 1)[0]);
    listChanged();
    return true;
  }

  function deleteKeyboard(index) {
    if (!confirm("Delete \"" + legendText(list[index], index) + "\"?")) return;
    list.splice(index, 1);
    listChanged();
    if (list.length) focusEntry(Math.min(index, list.length - 1), "[data-field=name]");
    else editorBody.querySelector(".add-btn").focus();
  }

  function buildEntry(keyboard, index) {
    var box = el("fieldset", "kb");
    var legend = el("legend", null, legendText(keyboard, index));
    box.appendChild(legend);

    ALL_FIELDS.forEach(function (f) {
      var key = f[0].toLowerCase();
      // Status is a single line on the card; every other field may contain line breaks.
      var input = el(key === "status" ? "input" : "textarea");
      if (key === "status") input.type = "text"; else input.rows = 1;
      input.id = "kb-" + index + "-" + key;
      input.value = keyboard[key] == null ? "" : keyboard[key];
      input.placeholder = "e.g. " + f[1];
      input.setAttribute("data-field", key);
      input.addEventListener("input", function () {
        keyboard[key] = input.value;
        rawText = null;
        if (key === "name") legend.textContent = legendText(keyboard, index);
        if (key !== "status") grow(input);
        changed();
      });
      var label = el("label", null, f[0]);
      label.htmlFor = input.id;
      box.appendChild(label);
      box.appendChild(input);
    });

    var actions = el("div", "kb-actions");
    // The buttons are left out of the Tab order, so that Tab goes from the last field
    // straight to the next keyboard. Each of them has a keyboard shortcut instead.
    function action(name, text, label, run) {
      var b = el("button", null, text);
      b.type = "button";
      b.tabIndex = -1;
      b.setAttribute("data-action", name);
      if (label) { b.setAttribute("aria-label", label); b.title = label; }
      b.addEventListener("click", run);
      actions.appendChild(b);
      return b;
    }
    action("up", "↑", "Move up (Alt+↑)", function () {
      if (moveKeyboard(index, -1)) focusEntry(index - 1, index - 1 > 0 ? "[data-action=up]" : "[data-action=down]");
    }).disabled = index === 0;
    action("down", "↓", "Move down (Alt+↓)", function () {
      if (moveKeyboard(index, 1)) focusEntry(index + 1, index + 1 < list.length - 1 ? "[data-action=down]" : "[data-action=up]");
    }).disabled = index === list.length - 1;
    actions.appendChild(el("span", "spacer"));
    function duplicate() {
      list.splice(index + 1, 0, Object.assign({}, keyboard));
      listChanged();
      focusEntry(index + 1, "[data-field=name]");
    }
    action("duplicate", "Duplicate", "Duplicate (Ctrl+Shift+D)", duplicate);
    action("delete", "Delete", "Delete (Ctrl+Shift+Backspace)", function () { deleteKeyboard(index); });
    box.appendChild(actions);

    box.addEventListener("keydown", function (e) {
      var up = e.key === "ArrowUp", down = e.key === "ArrowDown";
      if (e.altKey && (up || down)) {
        e.preventDefault();
        var t = e.target;
        var selector = t.hasAttribute("data-field") ? "[data-field=" + t.getAttribute("data-field") + "]"
          : "[data-action=" + t.getAttribute("data-action") + "]";
        var caret = t.hasAttribute("data-field") ? t.selectionStart : null;
        if (moveKeyboard(index, up ? -1 : 1)) focusEntry(index + (up ? -1 : 1), selector, caret);
        // An arrow button that is now disabled cannot take the focus; use the name field instead.
        if (!editorBody.contains(document.activeElement)) focusEntry(index + (up ? -1 : 1), "[data-field=name]");
      } else if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        addKeyboard(index + 1);
      } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "d") {
        e.preventDefault();
        duplicate();
      } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === "Backspace") {
        e.preventDefault();
        deleteKeyboard(index);
      }
    });
    return box;
  }

  function buildTextView() {
    var area = el("textarea", "text-view");
    area.value = currentText();
    area.spellcheck = false;
    area.setAttribute("aria-label", "Keyboards as text, one \"Field: value\" line per field");
    area.addEventListener("input", function () {
      rawText = area.value;
      list = parseKeyboards(rawText);
      changed();
    });
    return area;
  }

  function renderEditor() {
    var text = settings.view === "text";
    editorBody.textContent = "";
    editorBody.classList.toggle("text", text);
    if (text) {
      editorBody.appendChild(buildTextView());
      return;
    }
    list.forEach(function (k, i) { editorBody.appendChild(buildEntry(k, i)); });
    var add = el("button", "add-btn primary", "Add keyboard");
    add.type = "button";
    add.addEventListener("click", function () { addKeyboard(list.length); });
    editorBody.appendChild(add);
    editorBody.querySelectorAll("textarea").forEach(grow);
  }

  function replaceList(text, isEdit) {
    if (isEdit) {
      rawText = null;
      list = parseKeyboards(text);
      edited = true;
    } else {
      useFileText();
    }
    saveData();
    renderEditor();
    renderCards();
  }

  document.getElementById("import-btn").addEventListener("click", function () {
    document.getElementById("import-file").click();
  });
  document.getElementById("import-file").addEventListener("change", function () {
    var file = this.files[0];
    this.value = "";
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var imported = parseKeyboards(fromKeyboardsFile(String(reader.result)));
      if (!imported.length) { alert("No keyboards found in " + file.name + "."); return; }
      if (edited && list.length && !confirm("Replace the current keyboards with the " + imported.length + " from " + file.name + "?")) return;
      replaceList(serializeKeyboards(imported), true);
    };
    reader.readAsText(file);
  });

  document.getElementById("export-btn").addEventListener("click", function () {
    var link = el("a");
    link.href = URL.createObjectURL(new Blob([toKeyboardsFile(serializeKeyboards(list))], { type: "text/javascript" }));
    link.download = "keyboards.js";
    link.click();
    setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
  });

  // Save writes into the chosen keyboards.js itself (Chromium browsers only). The first click
  // asks for the file, later clicks overwrite it without further questions.
  var saveBtn = document.getElementById("save-btn");
  var saveHandle = null;
  if (typeof window.showSaveFilePicker === "function") {
    saveBtn.hidden = false;
    saveBtn.addEventListener("click", function () {
      var content = toKeyboardsFile(serializeKeyboards(list));
      var picking = saveHandle ? Promise.resolve(saveHandle) :
        window.showSaveFilePicker({ suggestedName: "keyboards.js", types: [{ description: "keyboards.js", accept: { "text/javascript": [".js"] } }] });
      picking.then(function (handle) {
        saveHandle = handle;
        return handle.createWritable().then(function (out) {
          return out.write(content).then(function () { return out.close(); });
        });
      }).then(function () {
        // The file now equals the list, so the next reload has nothing to ask about.
        seed = fromKeyboardsFile(content);
        saveData();
        var label = saveBtn.textContent;
        saveBtn.textContent = "Saved";
        setTimeout(function () { saveBtn.textContent = label; }, 1500);
      }, function (err) {
        if (err && err.name === "AbortError") return;
        saveHandle = null;
        alert("Could not save the file: " + (err && err.message || err));
      });
    });
  }

  // Local use only: warn when closing the page while keyboards.js differs from the list.
  if (typeof window.showSaveFilePicker === "function" && location.protocol === "file:") {
    window.addEventListener("beforeunload", function (e) {
      if (serializeKeyboards(list) !== serializeKeyboards(parseKeyboards(seed))) e.preventDefault();
    });
  }

  document.getElementById("clear-btn").addEventListener("click", function () {
    if (!list.length || !confirm("Remove all keyboards? Use Export first if you want to keep them.")) return;
    replaceList("", true);
    var first = editorBody.querySelector(".add-btn, .text-view");
    if (first) first.focus();
  });

  document.getElementById("logo-btn").addEventListener("click", function () {
    document.getElementById("logo-file").click();
  });
  document.getElementById("logo-file").addEventListener("change", function () {
    if (this.files[0]) readLogo(this.files[0]);
    this.value = "";
  });
  document.getElementById("logo-remove-btn").addEventListener("click", function () {
    setUploadedLogo("");
    document.getElementById("logo-btn").focus();
  });

  // Local use: keyboards.js was edited on disk while the browser still holds its own list.
  function buildFileNotice() {
    var box = document.getElementById("notice");
    function button(text, run) {
      var b = el("button", null, text);
      b.type = "button";
      b.addEventListener("click", function () { run(); box.hidden = true; });
      box.appendChild(b);
    }
    box.appendChild(el("span", null, "keyboards.js has changed, but the keyboards you edited in the browser are shown."));
    button("Load keyboards.js", function () { replaceList("", false); });
    button("Keep mine", function () { seed = fileText; saveData(); });
    box.hidden = false;
  }

  // ---- Cards ----

  function updateZoom() {
    var spec = LAYOUTS[settings.layout];
    var paper = PAPERS[settings.paper];
    var sheetPx = (spec.orientation === "landscape" ? paper.h : paper.w) * 96 / 25.4;
    var zoom = Math.min(1, (preview.clientWidth - 32) / sheetPx);
    document.documentElement.style.setProperty("--zoom", Math.max(0.2, zoom).toFixed(3));
  }

  function renderCards() {
    var spec = LAYOUTS[settings.layout];
    var paper = PAPERS[settings.paper];
    var perSheet = spec.cols * spec.rows;
    var landscape = spec.orientation === "landscape";
    var sheetW = landscape ? paper.h : paper.w;
    var sheetH = landscape ? paper.w : paper.h;
    var cardW = sheetW / spec.cols;
    var cardH = sheetH / spec.rows;
    var root = document.documentElement.style;

    root.setProperty("--sheet-w", sheetW + "mm");
    root.setProperty("--sheet-h", sheetH + "mm");
    root.setProperty("--card-w", cardW + "mm");
    root.setProperty("--card-h", cardH + "mm");
    root.setProperty("--cols", spec.cols);
    root.setProperty("--rows", spec.rows);
    root.setProperty("--s", Math.min(cardW / REF_W, cardH / REF_H).toFixed(3));
    pageStyle.textContent = "@page { size: " + paper.css + " " + spec.orientation + "; margin: 0; }";
    document.querySelectorAll(".seg button").forEach(function (b) {
      var key = b.parentNode.getAttribute("data-key");
      b.setAttribute("aria-pressed", String(settings[key] === b.getAttribute("data-value")));
    });
    updateZoom();

    // Keyboards without a name stay in the editor but get no card.
    var keyboards = [];
    list.forEach(function (k, i) { if (value(k, "name")) keyboards.push([k, i]); });

    sheets.textContent = "";
    if (!keyboards.length) {
      var empty = el("div", "empty");
      empty.appendChild(el("p", null, "No cards yet. Add a keyboard and give it a name, or import a keyboards.js file."));
      var examples = el("button", null, "Load examples");
      examples.type = "button";
      examples.addEventListener("click", function () { replaceList("", false); });
      empty.appendChild(examples);
      sheets.appendChild(empty);
      hint.textContent = "";
      return;
    }

    for (var i = 0; i < keyboards.length; i += perSheet) {
      var sheet = el("div", "sheet");
      keyboards.slice(i, i + perSheet).forEach(function (k) { sheet.appendChild(buildCard(k[0], k[1])); });
      while (sheet.children.length < perSheet) sheet.appendChild(el("section", "card"));
      Array.prototype.forEach.call(sheet.children, function (card, n) {
        if (n % spec.cols === spec.cols - 1) card.classList.add("last-col");
        if (n >= perSheet - spec.cols) card.classList.add("last-row");
      });
      sheets.appendChild(sheet);
    }

    var sheetCount = Math.ceil(keyboards.length / perSheet);
    hint.textContent = keyboards.length + (keyboards.length === 1 ? " card" : " cards") + " on " +
      sheetCount + (sheetCount === 1 ? " sheet" : " sheets") +
      " · print on " + paper.label + " " + spec.orientation + " at 100% scale, no margins";
    fitNames();
  }

  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      var key = b.parentNode.getAttribute("data-key");
      settings[key] = b.getAttribute("data-value");
      saveSettings();
      if (key === "view") renderEditor();
      renderCards();
    });
  });
  window.addEventListener("resize", updateZoom);

  var editorBtn = document.getElementById("editor-btn");
  function applyEditorVisibility() {
    document.body.classList.toggle("editor-hidden", !settings.editor);
    editorBtn.textContent = settings.editor ? "Hide editor" : "Show editor";
    editorBtn.setAttribute("aria-expanded", String(settings.editor));
    updateZoom();
  }
  editorBtn.addEventListener("click", function () {
    settings.editor = !settings.editor;
    saveSettings();
    applyEditorVisibility();
  });

  loadData();
  if (typeof window.KEYBOARDS !== "string" && !window.KEYBOARDS_MISSING) {
    document.getElementById("setup-error").appendChild(buildSetupError());
  } else if (edited && seed !== fileText && location.protocol === "file:") {
    buildFileNotice();
  }
  var logoRemoved = false;
  try { uploadedLogo = localStorage.getItem(LOGO_KEY) || ""; } catch (e) {}
  if (uploadedLogo === NO_LOGO) { uploadedLogo = ""; logoRemoved = true; }
  logoSrc = uploadedLogo;
  document.getElementById("logo-remove-btn").hidden = !uploadedLogo;
  applyEditorVisibility();
  renderEditor();
  renderCards();
  if (!logoRemoved) loadLogoFile(0);
})();
</script>
</body>
</html>
