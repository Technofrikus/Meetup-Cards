<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetup Cards</title>
<style>
  /* The print page size is set from script (see applyFormat), because @page cannot depend on a class. */
  :root {
    --s: 1;            /* content scale: A6 = 1 */
    --cols: 2;
    --rows: 2;
    --sheet-w: 210mm;
    --sheet-h: 297mm;
    --card-w: 105mm;
    --card-h: 148.5mm;
  }
  body[data-format="a7"] {
    --s: 0.7;
    --cols: 4;
    --rows: 2;
    --sheet-w: 297mm;
    --sheet-h: 210mm;
    --card-w: 74.25mm;
    --card-h: 105mm;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #e9e9ec;
    color: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #d0d0d5;
    font-size: 14px;
  }
  .toolbar button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid #111;
    border-radius: 6px;
    background: #111;
    color: #fff;
    cursor: pointer;
  }
  .toolbar .formats { display: flex; }
  .toolbar .formats button {
    background: #fff;
    color: #111;
    border-radius: 0;
    margin-left: -1px;
  }
  .toolbar .formats button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .toolbar .formats button:last-child { border-radius: 0 6px 6px 0; }
  .toolbar .formats button[aria-pressed="true"] { background: #111; color: #fff; }
  .toolbar .hint { color: #666; }

  /* One A4 sheet = 2 x 2 A6 cards (portrait sheet) or 4 x 2 A7 cards (landscape sheet) */
  .sheet {
    width: var(--sheet-w);
    height: var(--sheet-h);
    margin: 16px auto;
    background: #fff;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--card-w));
    grid-template-rows: repeat(var(--rows), var(--card-h));
    overflow: hidden;
    break-after: page;
  }
  .sheet:last-child { break-after: auto; }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    padding: calc(11mm * var(--s)) calc(10mm * var(--s)) calc(10mm * var(--s));
    overflow: hidden;
  }
  /* Cut guides between the cards (script marks the last column / row) */
  .card { border-right: 0.2mm dashed #bbb; border-bottom: 0.2mm dashed #bbb; }
  .card.last-col { border-right: 0; }
  .card.last-row { border-bottom: 0; }

  .head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: calc(6mm * var(--s));
    min-height: calc(20mm * var(--s));
  }
  .name {
    margin: 0;
    font-size: calc(25pt * var(--s));
    line-height: 1.08;
    font-weight: 800;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }
  .logo {
    flex: none;
    max-width: calc(24mm * var(--s));
    max-height: calc(18mm * var(--s));
    object-fit: contain;
  }

  .status {
    align-self: flex-start;
    margin-top: calc(4mm * var(--s));
    padding: calc(1.2mm * var(--s)) calc(3.2mm * var(--s));
    border: 0.35mm solid #111;
    border-radius: 99mm;
    font-size: calc(9pt * var(--s));
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .specs {
    margin: calc(9mm * var(--s)) 0 0;
    display: flex;
    flex-direction: column;
    gap: calc(6mm * var(--s));
  }
  .specs dt {
    font-size: calc(8pt * var(--s));
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #666;
  }
  .specs dd {
    margin: calc(1mm * var(--s)) 0 0;
    font-size: calc(15pt * var(--s));
    line-height: 1.2;
    font-weight: 500;
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  .url {
    margin-top: auto;
    padding-top: calc(3mm * var(--s));
    border-top: 0.35mm solid #111;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: calc(9pt * var(--s));
    overflow-wrap: anywhere;
    white-space: pre-line;
  }

  .setup-error {
    margin: 40px auto;
    max-width: 560px;
    padding: 20px 24px;
    background: #fff;
    border: 2px solid #c62828;
    border-radius: 8px;
    line-height: 1.45;
  }
  .setup-error h2 { margin: 0 0 8px; color: #c62828; }
  .setup-error pre { padding: 12px; background: #f3f3f5; border-radius: 6px; overflow-x: auto; }

  .empty {
    margin: 40px auto;
    max-width: 480px;
    text-align: center;
    color: #666;
  }

  @media print {
    body { background: none; }
    .toolbar, .empty, .setup-error { display: none; }
    .sheet { margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <button type="button" onclick="window.print()">Print</button>
  <div class="formats" role="group" aria-label="Card format">
    <button type="button" data-format="a6" aria-pressed="true">A6</button>
    <button type="button" data-format="a7" aria-pressed="false">A7</button>
  </div>
  <span class="hint" id="hint"></span>
</div>
<main id="sheets"></main>

<script src="keyboards.js"></script>
<script>
(function () {
  // A6: 2 x 2 per portrait A4 sheet. A7: 4 x 2 per landscape A4 sheet.
  var FORMATS = {
    a6: { cols: 2, rows: 2, orientation: "portrait", label: "A6" },
    a7: { cols: 4, rows: 2, orientation: "landscape", label: "A7" },
  };
  var STORAGE_KEY = "meetup-cards-format";
  var logoSrc = "";
  var LOGO_CANDIDATES = ["logo.svg", "logo.png", "logo.jpg", "logo.jpeg", "logo.webp"];
  var SPEC_FIELDS = [
    ["switches", "Switches"],
    ["keycaps", "Keycaps"],
    ["plate", "Plate"],
    ["notes", "Notes"],
  ];
  // Alternative spellings accepted in keyboards.js
  var ALIASES = { note: "notes", comment: "notes", comments: "notes" };

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function value(keyboard, field) {
    var v = keyboard[field];
    return v == null ? "" : String(v).trim();
  }

  function buildCard(keyboard) {
    var card = el("section", "card");

    var head = el("div", "head");
    head.appendChild(el("h1", "name", value(keyboard, "name")));
    if (logoSrc) head.appendChild(buildLogo());
    card.appendChild(head);

    var status = value(keyboard, "status");
    if (status) card.appendChild(el("div", "status", status));

    var specs = el("dl", "specs");
    SPEC_FIELDS.forEach(function (field) {
      var v = value(keyboard, field[0]);
      if (!v) return;
      var row = el("div");
      row.appendChild(el("dt", null, field[1]));
      row.appendChild(el("dd", null, v));
      specs.appendChild(row);
    });
    if (specs.children.length) card.appendChild(specs);

    var url = value(keyboard, "url");
    if (url) card.appendChild(el("div", "url", url));

    return card;
  }

  function buildLogo() {
    var img = el("img", "logo");
    img.src = logoSrc;
    img.alt = "";
    return img;
  }

  // The logo is optional: only add it to the cards once a file actually loaded.
  function loadLogo(index) {
    if (index >= LOGO_CANDIDATES.length) return;
    var probe = new Image();
    probe.onload = function () {
      logoSrc = probe.src;
      document.querySelectorAll(".head").forEach(function (head) {
        head.appendChild(buildLogo());
      });
    };
    probe.onerror = function () { loadLogo(index + 1); };
    probe.src = LOGO_CANDIDATES[index];
  }

  // keyboards.js holds plain "Field: value" lines; an empty line starts the next keyboard.
  function parseKeyboards(text) {
    var list = [];
    var current = null;
    String(text || "").split(/\r?\n/).forEach(function (line) {
      line = line.trim();
      if (!line) { current = null; return; }
      if (line.charAt(0) === "#") return;
      var colon = line.indexOf(":");
      if (colon < 1) return;
      if (!current) { current = {}; list.push(current); }
      var field = line.slice(0, colon).trim().toLowerCase();
      // A literal \n in the text forces a line break on the card.
      current[ALIASES[field] || field] = line.slice(colon + 1).trim().replace(/\s*\\n\s*/g, "\n");
    });
    return list;
  }

  var keyboards = parseKeyboards(window.KEYBOARDS).filter(function (k) { return k && value(k, "name"); });
  var sheets = document.getElementById("sheets");
  var hint = document.getElementById("hint");
  var pageStyle = document.createElement("style");
  document.head.appendChild(pageStyle);

  // Shown when keyboards.js lost its first or last line (the file then fails to load).
  function buildSetupError() {
    var box = el("div", "setup-error");
    box.appendChild(el("h2", null, "keyboards.js could not be read"));
    box.appendChild(el("p", null, "The first and the last line of the file are needed. Make sure it starts with the first line below, ends with the last line below, and has the keyboards in between:"));
    box.appendChild(el("pre", null, "window.KEYBOARDS = String.raw`\n\nName: My keyboard\nSwitches: ...\n\n`;"));
    box.appendChild(el("p", null, "Also check that the text in between contains no backtick (`)."));
    return box;
  }

  function savedFormat() {
    try {
      var f = localStorage.getItem(STORAGE_KEY);
      return FORMATS[f] ? f : "a6";
    } catch (e) { return "a6"; }
  }

  function render(format) {
    var spec = FORMATS[format];
    var perSheet = spec.cols * spec.rows;

    document.body.setAttribute("data-format", format);
    pageStyle.textContent = "@page { size: A4 " + spec.orientation + "; margin: 0; }";
    document.querySelectorAll(".formats button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-format") === format));
    });

    sheets.textContent = "";
    if (typeof window.KEYBOARDS !== "string") {
      sheets.appendChild(buildSetupError());
      hint.textContent = "keyboards.js could not be read";
      return;
    }
    if (!keyboards.length) {
      sheets.appendChild(el("p", "empty", "No keyboards found. Add entries to keyboards.js and reload."));
      hint.textContent = "";
      return;
    }

    for (var i = 0; i < keyboards.length; i += perSheet) {
      var sheet = el("div", "sheet");
      keyboards.slice(i, i + perSheet).forEach(function (k) { sheet.appendChild(buildCard(k)); });
      while (sheet.children.length < perSheet) sheet.appendChild(el("section", "card"));
      Array.prototype.forEach.call(sheet.children, function (card, n) {
        if (n % spec.cols === spec.cols - 1) card.classList.add("last-col");
        if (n >= perSheet - spec.cols) card.classList.add("last-row");
      });
      sheets.appendChild(sheet);
    }

    var sheetCount = Math.ceil(keyboards.length / perSheet);
    hint.textContent = keyboards.length + (keyboards.length === 1 ? " card" : " cards") + " on " +
      sheetCount + (sheetCount === 1 ? " sheet" : " sheets") +
      " · print on A4 " + spec.orientation + " at 100% scale, no margins";
  }

  document.querySelectorAll(".formats button").forEach(function (b) {
    b.addEventListener("click", function () {
      var format = b.getAttribute("data-format");
      try { localStorage.setItem(STORAGE_KEY, format); } catch (e) {}
      render(format);
    });
  });

  render(savedFormat());
  loadLogo(0);
})();
</script>
</body>
</html>
